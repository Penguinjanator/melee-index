<div class="flex flex-col">
  {{ skillLevel() }}
  <progress
    [class.progress-primary]="skillLevel() === 'Intermediate'"
    [class.progress-warning]="skillLevel() === 'Advanced'"
    [class.progress-error]="skillLevel() === 'Expert'"
    class="progress w-20"
    [value]="percentage()"
    max="100"
  ></progress>
</div>
